<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:attr="data-theme=${profile.theme()}">
<head th:replace="~{fragments/shell :: head(${pageTitle})}"></head>
<body>
<div th:replace="~{fragments/shell :: layout(~{::section})}">
    <section class="space-y-6">
        <div class="flex items-center justify-between">
            <h1 class="text-3xl font-extrabold tracking-tight">Household Audit History</h1>
            <a th:href="@{/api/export.csv}" class="px-4 py-2 rounded-xl bg-[var(--accent-primary)] text-[var(--accent-contrast)] text-xs font-semibold">Export CSV</a>
        </div>
        <div class="bento-card p-6 overflow-x-auto">
            <table class="w-full text-left text-sm">
                <thead>
                <tr class="border-b border-[var(--border-subtle)] text-xs text-[var(--text-muted)]">
                    <th class="py-2">Cycle</th>
                    <th class="py-2">Region</th>
                    <th class="py-2 text-right">Solar %</th>
                    <th class="py-2 text-right">Total CO₂e</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="a : ${audits}" class="border-b border-[var(--border-subtle)] last:border-b-0">
                    <td class="py-3 font-semibold" th:text="${a.label() + ' (' + a.month() + ')'}"></td>
                    <td class="py-3 text-xs" th:text="${a.regionId().shortName}"></td>
                    <td class="py-3 text-right font-mono" th:text="${a.solarOffsetPct() + '%'}"></td>
                    <td class="py-3 text-right font-mono font-bold" th:text="${a.totalKgCo2e() + ' kg'}"></td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
</div>
</body>
</html>
