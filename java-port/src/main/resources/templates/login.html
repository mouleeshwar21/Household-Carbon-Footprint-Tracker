<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/shell :: head('Sign In — EcoTrack V22')}"></head>
<body class="min-h-screen flex items-center justify-center bg-[#071915] p-6 relative overflow-hidden">
<div th:replace="~{fragments/shell :: startIntro}"></div>
<div class="relative z-10 w-full max-w-[440px] liquid-glass-panel rounded-[28px] p-8 text-white">
    <div class="mb-6">
        <h1 class="text-xl font-extrabold">EcoTrack V22</h1>
        <p class="font-editorial text-xs text-emerald-100/80">TerraLedger Household Carbon Ledger</p>
    </div>

    <form th:action="@{/dashboard}" method="get" class="space-y-4">
        <div>
            <label class="block text-xs font-medium text-emerald-100/85 mb-1.5">Email Address</label>
            <input type="email" required placeholder="household@example.com" class="liquid-glass-input w-full h-11 px-4 rounded-xl text-sm text-white" />
        </div>
        <div>
            <label class="block text-xs font-medium text-emerald-100/85 mb-1.5">Password</label>
            <input type="password" required placeholder="••••••••" class="liquid-glass-input w-full h-11 px-4 rounded-xl text-sm text-white" />
        </div>
        <button type="submit" class="w-full h-11 rounded-xl bg-[#fcd34d] text-[#132a26] text-sm font-bold btn-press">
            Unlock Workspace
        </button>
    </form>

    <div class="mt-4">
        <a th:href="@{/dashboard}" class="w-full h-10 rounded-xl bg-emerald-400/15 border border-emerald-300/30 text-xs font-semibold text-emerald-100 flex items-center justify-center">
            Demo Account
        </a>
    </div>
</div>
</body>
</html>
